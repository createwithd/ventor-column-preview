<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>VENTOR Column Meta-ads</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Jost:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F2EC;--fg:#1C1C1C;--zacht:#5E5853;--lijn:#DDD3C4;--corten:#8A4B2A;--kaart:#fff;--tel:#111}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.55 Inter,system-ui,sans-serif;padding:32px max(16px,env(safe-area-inset-right)) 80px max(16px,env(safe-area-inset-left))}
.wrap{max-width:1280px;margin:0 auto}
h1,h2{font-family:Jost,system-ui,sans-serif;font-weight:500;line-height:1.15}
h1{font-size:clamp(28px,4vw,40px)}
h2{font-size:26px;margin:48px 0 6px}
.lead{color:var(--zacht);max-width:68ch;margin-top:8px}
.links{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.links a{border:1px solid var(--lijn);border-radius:4px;padding:8px 14px;text-decoration:none;font-weight:600;background:var(--kaart);color:var(--corten)}
.tabs{display:flex;gap:8px;margin:20px 0 4px;flex-wrap:wrap}
.tabs button{font:inherit;font-weight:600;border:1px solid var(--lijn);background:var(--kaart);border-radius:999px;padding:8px 16px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--fg);color:#fff;border-color:var(--fg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:28px;margin-top:20px}
.ad{min-width:0}
.tel{background:var(--tel);border-radius:34px;padding:10px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.scherm{background:#fff;border-radius:26px;overflow:hidden;color:#111;font-size:13px}
.kop{display:flex;align-items:center;gap:8px;padding:10px 12px}
.kop .av{width:30px;height:30px;border-radius:50%;background:#1C1C1C url('https://ventorfire.com/cdn/shop/files/Ventor_brand_logo_RGB.jpg?width=120') center/80% no-repeat;filter:invert(1)}
.kop b{display:block;font-size:13px}.kop small{color:#777;font-size:11.5px}
.tekst{margin:0 12px 8px;font-size:13px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.media{display:block;width:100%;border:0;padding:0;background:#000;cursor:zoom-in;position:relative}
.media img,.media video{display:block;width:100%;aspect-ratio:4/5;object-fit:cover}
.cta{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;background:#F3F3F3}
.cta span{font-size:12.5px;line-height:1.3}.cta b{display:block;font-size:13.5px}
.cta em{font-style:normal;font-weight:600;background:#E4E6EB;border-radius:6px;padding:7px 12px;white-space:nowrap;font-size:13px}
.story .scherm{background:#000;position:relative}
.story .media img,.story .media video{aspect-ratio:9/16}
.story .bovenbalk{position:absolute;left:10px;right:10px;top:10px;z-index:2;color:#fff;display:flex;align-items:center;gap:8px;font-size:12.5px;pointer-events:none}
.story .bovenbalk .av{filter:none;background-color:#fff}
.story .onderbalk{position:absolute;left:0;right:0;bottom:12px;z-index:2;display:flex;justify-content:center;pointer-events:none}
.story .onderbalk em{font-style:normal;background:#fff;color:#111;font-weight:600;border-radius:999px;padding:8px 18px;font-size:13px}
.play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:72px;height:72px;border-radius:50%;background:rgba(14,12,11,.62);display:flex;align-items:center;justify-content:center;pointer-events:none}
.play svg{width:34px;height:34px;margin-left:5px;fill:#fff}
.onder{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:10px}
.onder strong{font-family:Jost,sans-serif;font-weight:500;font-size:18px}
.uitleg-knop{font:inherit;font-weight:600;font-size:14px;border:1px solid var(--corten);color:var(--corten);background:transparent;border-radius:4px;padding:6px 12px;cursor:pointer}
.uitleg{display:none;margin-top:10px;background:var(--kaart);border:1px solid var(--lijn);border-radius:6px;padding:14px;font-size:14.5px;color:var(--zacht)}
.uitleg.open{display:block}
.uitleg b{color:var(--fg)}
.uitleg p+p{margin-top:8px}
[hidden]{display:none!important}
.lb{position:fixed;inset:0;z-index:50;background:rgba(10,8,7,.95);display:flex;align-items:center;justify-content:center;padding:56px 16px 24px}
.lb img,.lb video{max-width:100%;max-height:100%;border-radius:6px}
.lb .x{position:absolute;top:12px;right:12px;width:48px;height:48px;border-radius:50%;border:0;background:rgba(255,255,255,.15);color:#fff;font-size:28px;cursor:pointer}
.tabel{overflow-x:auto;margin-top:14px}
table{border-collapse:collapse;width:100%;min-width:560px;background:var(--kaart);font-size:15px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--lijn);vertical-align:top}
</style>
</head>
<body>
<div class="wrap">
  <h1>VENTOR® Column · Meta-ads</h1>
  <div class="tabs" role="group" aria-label="Formaat">
    <button type="button" data-fmt="fd" aria-pressed="true">Feed (4:5)</button>
    <button type="button" data-fmt="st" aria-pressed="false">Story (9:16)</button>
  </div>
  <div class="grid" id="beelden"></div>
  <div class="grid" id="videos"></div>
</div>

<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="Groot bekijken">
  <button class="x" type="button" id="lbX" aria-label="Sluiten">×</button>
  <div id="lbIn" style="display:flex;align-items:center;justify-content:center;width:100%;height:100%"></div>
</div>

<script>
var LINK='ventorfire.com';
var VIDS=[
 {id:'V1',f:'ventor-column-productvideo',naam:'Productvideo met de oprichter (55 s)',tekst:'Greg, oprichter van VENTOR®, laat de nieuwe Column zien: slank cortenstaal, 190 cm, het vuur verhoogd. Alleen met Black Friday: €400 korting + gratis verzending.',kop:'Nieuw: de VENTOR® Column',knop:'Nu kopen',
  uitleg:['<b>Waarom:</b> dit is de video die al live draait. Bij de Original verkocht de video met de oprichter het best (2 aankopen, €4.961 omzet).','<b>Hoe gemaakt:</b> de originele video, alleen lichter gemaakt (720p) zodat hij soepel laadt.','<b>Hook:</b> de oprichter in beeld bij het product; echt, niet gespeeld.']},
 {id:'V2',f:'ventor-column-bf-sfeer',naam:'Sfeer + aanbod (10 s)',tekst:'Van blauw uur tot dakterras: de VENTOR® Column past in elke tuin. Alleen met Black Friday: €400 korting + gratis verzending. T/m 30 november.',kop:'Black Friday: €400 korting',knop:'Nu kopen',
  uitleg:['<b>Waarom:</b> laat in 10 seconden zien dat de Column overal past (terras, tuin, dakterras) en eindigt op het product met de korting.','<b>Hoe gemaakt:</b> de 4 gekozen sfeerbeelden (23, 24, 37, 05) met langzame zoom, daarna de packshot. Black Friday-balk onderin, muziek uit de bestaande VENTOR-video’s.','<b>Hook:</b> beweging en vuur in de eerste seconde.']}
];
var ADS=[
 {id:'B01',naam:'Langer buiten',tekst:'Om 23:00 zit iedereen nog buiten. De VENTOR® Column zet het vuur op zithoogte, midden in je tuin. Nieuw, en alleen met Black Friday €400 korting.',kop:'Nieuw: de VENTOR® Column',knop:'Nu kopen',uitleg:['<b>Avatar:</b> de Gastheer. Wil dat de avond niet stopt als het afkoelt.','<b>Hook:</b> "Om 23:00 zit iedereen nog buiten." Dezelfde hook die bij de Original de meeste kliks haalde.','<b>Beeld:</b> de packshot groot op crème, dus het product staat voorop.']},
 {id:'B02',naam:'Avonden verlengen',tekst:'Verleng je avonden buiten. Met de VENTOR® Column zit je langer buiten, bij een echt houtvuur. Black Friday: €400 korting.',kop:'Langer buiten zitten',knop:'Nu kopen',uitleg:['<b>Avatar:</b> de Gastheer, motief "de avond rekken".','<b>Hook:</b> avonden verlengen, langer buiten zitten.','<b>Beeld:</b> sfeerbeeld 37, foto vult het hele beeld, haard in het midden.']},
 {id:'B03',naam:'Warmte',tekst:'Een terrasheater is warm, maar geen sfeer. De VENTOR® Column geeft de warmte van een echt houtvuur, en iedereen kijkt in de vlammen. €400 korting met Black Friday.',kop:'Warmte én vuur · −€400',knop:'Nu kopen',uitleg:['<b>Avatar:</b> de Gastheer. Bezwaar uit de avatar: "Het is warm, maar het voelt als een wachtruimte" (terrasheater).','<b>Hook:</b> warmte die je voelt.','<b>Beeld:</b> de packshot op warm zand.']},
 {id:'B04',naam:'Tuin of terras',tekst:'Groot terras of kleine tuin: de VENTOR® Column is slank (190 cm, 40 cm breed) en past waar jij wilt zitten. Met Black Friday €400 korting.',kop:'Voor je tuin of terras',knop:'Meer info',uitleg:['<b>Avatar:</b> de Gastheer met een kleinere tuin, bezwaar "past hij wel?"','<b>Hook:</b> voor je tuin of je terras.','<b>Beeld:</b> sfeerbeeld 23 (terras bij blauw uur).']},
 {id:'B05',naam:'Tuin af',tekst:'Bestrating ligt, lounge staat, verlichting doet het. Wat ontbreekt is een plek waar iedereen vanzelf gaat zitten. De VENTOR® Column. −€400 met Black Friday.',kop:'Je tuin is af. Bijna.',knop:'Nu kopen',uitleg:['<b>Avatar:</b> de Gastheer die net de tuin heeft laten aanleggen.','<b>Hook:</b> "Je tuin is af. Op één ding na." Uit het merkfundament.','<b>Beeld:</b> packshot groot, met twee sfeerbeelden ernaast als bewijs.']},
 {id:'B06',naam:'Blikvanger',tekst:'Iedereen die binnenkomt, vraagt wat dat is. De VENTOR® Column: cortenstaal, 190 cm, een blikvanger in je tuin. Black Friday: €400 korting.',kop:'De blikvanger van je tuin',knop:'Meer info',uitleg:['<b>Avatar:</b> de Gastheer, motief "trots / gastvrijheid".','<b>Hook:</b> letterlijk uit de avatar-quote "Iedereen vraagt wat dat is."','<b>Beeld:</b> sfeerbeeld 24 (grind en berken).']},
 {id:'B07',naam:'Ook zonder vuur',tekst:'Overdag een beeld van cortenstaal, ’s avonds het middelpunt van de tuin. De VENTOR® Column wordt elk jaar mooier. Alleen met Black Friday €400 korting.',kop:'Blikvanger, dag en nacht',knop:'Meer info',uitleg:['<b>Avatar:</b> de Gastheer die om uitstraling geeft.','<b>Hook:</b> blikvanger, ook als hij niet brandt.','<b>Beeld:</b> de packshot op warm zand.']},
 {id:'B08',naam:'Samen buiten',tekst:'Langer samen buiten, ook op je terras. De VENTOR® Column geeft warmte voor iedereen die aanschuift. Nieuw, met Black Friday €400 korting.',kop:'Langer samen buiten',knop:'Nu kopen',uitleg:['<b>Avatar:</b> de Gastheer, kernbelofte "Langer samen bij het vuur."','<b>Hook:</b> de merkbelofte.','<b>Beeld:</b> sfeerbeeld 05 (dakterras).']}
];
var fmt='fd';
function kop(){return '<div class="kop"><span class="av"></span><span><b>VENTOR®</b><small>Gesponsord</small></span></div>'}
function cta(k,b){return '<div class="cta"><span>'+LINK.toUpperCase()+'<b>'+k+'</b></span><em>'+b+'</em></div>'}
function uitleg(u,id){return '<button class="uitleg-knop" type="button" aria-expanded="false" aria-controls="u'+id+'">Uitleg</button></div><div class="uitleg" id="u'+id+'">'+u.map(function(x){return '<p>'+x+'</p>'}).join('')+'</div>'}
var PLAY='<span class="play"><svg viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z"/></svg></span>';
function vidKaart(v){
  return '<div class="ad story"><div class="tel"><div class="scherm"><div class="bovenbalk"><span class="av"></span><b>VENTOR®</b> · Gesponsord</div><button class="media" type="button" data-video="vid/'+v.f+'.mp4" aria-label="Video '+v.id+' groot afspelen"><img src="vid/'+v.f+'.jpg" alt="'+v.naam+'" loading="lazy">'+PLAY+'</button><div class="onderbalk"><em>'+v.knop+'</em></div></div></div><div class="onder"><strong>'+v.id+' · '+v.naam+'</strong>'+uitleg(v.uitleg,v.id)+'</div>';
}
function adKaart(a){
  var src='ads/ventor-column-'+a.id.toLowerCase()+'-'+fmt+'.jpg';
  if(fmt==='st') return '<div class="ad story"><div class="tel"><div class="scherm"><div class="bovenbalk"><span class="av"></span><b>VENTOR®</b> · Gesponsord</div><button class="media" type="button" data-img="'+src+'" aria-label="'+a.id+' groot bekijken"><img src="'+src+'" alt="'+a.naam+'" loading="lazy"></button><div class="onderbalk"><em>'+a.knop+'</em></div></div></div><div class="onder"><strong>'+a.id+' · '+a.naam+'</strong>'+uitleg(a.uitleg,a.id)+'</div>';
  return '<div class="ad"><div class="tel"><div class="scherm">'+kop()+'<p class="tekst">'+a.tekst+'</p><button class="media" type="button" data-img="'+src+'" aria-label="'+a.id+' groot bekijken"><img src="'+src+'" alt="'+a.naam+'" loading="lazy"></button>'+cta(a.kop,a.knop)+'</div></div><div class="onder"><strong>'+a.id+' · '+a.naam+'</strong>'+uitleg(a.uitleg,a.id)+'</div>';
}
function bouw(){document.getElementById('beelden').innerHTML=ADS.map(adKaart).join('');koppel(document.getElementById('beelden'))}
document.getElementById('videos').innerHTML=VIDS.map(vidKaart).join('');
function koppel(root){
  root.querySelectorAll('.uitleg-knop').forEach(function(b){b.addEventListener('click',function(){var u=document.getElementById(b.getAttribute('aria-controls'));var o=u.classList.toggle('open');b.setAttribute('aria-expanded',o)})});
  root.querySelectorAll('.media').forEach(function(m){m.addEventListener('click',function(){open(m)})});
}
var lb=document.getElementById('lb'), lbIn=document.getElementById('lbIn');
function open(m){
  if(m.dataset.video){lbIn.innerHTML='<video src="'+m.dataset.video+'" controls autoplay playsinline></video>';var v=lbIn.querySelector('video');v.muted=false;var p=v.play();if(p&&p.catch)p.catch(function(){})}
  else lbIn.innerHTML='<img src="'+m.dataset.img+'" alt="">';
  lb.hidden=false;document.getElementById('lbX').focus();
}
function dicht(){lb.hidden=true;lbIn.innerHTML=''}
document.getElementById('lbX').addEventListener('click',dicht);
lb.addEventListener('click',function(e){if(e.target===lb||e.target===lbIn)dicht()});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!lb.hidden)dicht()});
document.querySelectorAll('.tabs button').forEach(function(b){b.addEventListener('click',function(){fmt=b.dataset.fmt;document.querySelectorAll('.tabs button').forEach(function(x){x.setAttribute('aria-pressed',x===b)});bouw()})});
koppel(document.getElementById('videos'));
bouw();
</script>
</body>
</html>
